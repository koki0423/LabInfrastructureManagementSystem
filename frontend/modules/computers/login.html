<div class="screen-content">
    <h2>計算機管理ログイン</h2>
    <div class="registration-page-lead">
        この機能は、アクセス権を持つ利用者のみ利用できます。
    </div>

    <p id="computer-login-error" class="form-feedback"></p>

    <form id="form-computer-login" onsubmit="event.preventDefault(); ComputerController.login();">
        <div class="form-group registration-section-card">
            <label>アカウントID</label>
            <input type="text" id="computer-id" placeholder="例: sys-computer-admin" autocomplete="username" required>

            <div class="mt-20">
                <label>パスワード</label>
                <input type="password" id="computer-pass" placeholder="パスワードを入力" autocomplete="current-password" required>
            </div>
        </div>
    </form>

    <div class="nav-buttons registration-nav-buttons">
        <button id="computer-login-back-btn" class="back-btn" onclick="Router.to('main-menu')">戻る</button>
        <button id="computer-login-btn" class="primary-btn" onclick="ComputerController.login()">ログイン</button>
    </div>
</div>
