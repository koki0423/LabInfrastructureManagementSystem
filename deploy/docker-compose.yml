services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lims_v2}
      TZ: UTC
    volumes:
      - ${LIMS_DATA_DIR:?LIMS_DATA_DIR must be set}:/var/lib/mysql
      - /usr/share/lims/db/lims_v3-init.sql:/docker-entrypoint-initdb.d/10-lims_v3-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    image: lims-backend:${LIMS_IMAGE_TAG:-1.0.0}
    build:
      context: /usr/lib/lims
      dockerfile: /usr/share/lims/backend.Dockerfile
    restart: unless-stopped
    environment:
      APP_VERSION: ${LIMS_IMAGE_TAG:-1.0.0}
      APP_MODE: release
      APP_TLS: "false"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: ${DB_NAME:-lims_v2}
      FRONTEND_MODE: external
      FRONTEND_INDEX_FILE: index.html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8443/ping >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - ${LIMS_HTTP_PORT:-80}:80
    volumes:
      - /usr/share/lims/frontend:/usr/share/nginx/html:ro
      - /usr/share/lims/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
